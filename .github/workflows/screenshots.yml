name: Build & screenshots

# The only way to see real Compose output: there is no JDK or Android SDK in the
# agent sandbox, so the app is built and rendered here and the PNGs come back as artifacts.
#
# Produces:
#   build-output   — assembleDebug log + APK
#   screenshots    — app/src/test/screenshots/*.png rendered by Roborazzi

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: ['arena/**']

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # ubuntu-latest images ship an Android SDK; using it avoids a third-party setup
      # action that has been failing on this repo's CI.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || { echo "::error::no Android SDK on runner"; exit 1; }
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          else
            echo "::warning::sdkmanager not found, skipping license step"
          fi

      # Either of these missing fails the build: the secrets plugin reads .env,
      # and the debug build type points at a debug.keystore that is gitignored.
      - name: Provide .env
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi

      - name: Generate debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Record Roborazzi screenshots
        run: ./gradlew :app:recordRoborazziDebug --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/src/test/screenshots/**/*.png
          if-no-files-found: warn
          retention-days: 30
